name: Validate policy

on:
  pull_request:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Regenerate policy files
        run: |
          bash ./scripts/sync-policy.sh
          if ! git diff --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add github-review-policy.md skill/references/*.md
            git commit -m "Regenerate policy files"
            git push origin HEAD:${{ github.head_ref }}
          fi
      - name: Check generated policy files
        run: bash ./scripts/check-policy.sh
