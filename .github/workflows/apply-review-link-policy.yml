name: Apply review link policy

on:
  push:
    branches:
      - agent/link-submitted-review

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/link-submitted-review
      - name: Update generic policy
        shell: python
        run: |
          from pathlib import Path

          path = Path("policy/generic.md")
          text = path.read_text()

          anchor = "Only report that the review was successfully submitted **after this verification**.\n\n"
          replacement = """Only report that the review was successfully submitted **after this verification**.\n\n### Link to every created review\n\nAfter any GitHub review submission that results in a review being created, always include a **clickable Markdown link to that exact submitted review** when reporting the submission outcome, whether verification succeeds or fails.\n\n- Prefer the canonical review URL returned by GitHub.\n- Link directly to the submitted review rather than only to the pull request.\n- If GitHub does not return a direct review URL, construct the direct review permalink from the repository, pull request, and created review ID when possible.\n- Use concise link text such as `[View submitted review](<review-url>)`.\n- When verification fails, include the link together with the explanation of what is incomplete, missing, altered, or otherwise incorrect.\n- Do not omit the review link merely because follow-up correction is still required.\n- If no review was created, do not fabricate a review link.\n\n"""

          if text.count(anchor) != 1:
              raise SystemExit(f"Expected verification anchor once, found {text.count(anchor)}")

          text = text.replace(anchor, replacement, 1)
          text = text.replace(
              "15. Only then report successful completion.\n\n### Re-review",
              "15. Only then report successful completion, including the clickable link to the submitted review.\n\n### Re-review",
              1,
          )
          text = text.replace(
              "15. Only then report successful completion.\n\n---",
              "15. Only then report successful completion, including the clickable link to the submitted review.\n\n---",
              1,
          )
          path.write_text(text)
      - name: Regenerate policy artifacts
        run: bash ./scripts/sync-policy.sh
      - name: Check policy artifacts
        run: bash ./scripts/check-policy.sh
      - name: Commit generated policy update
        run: |
          rm .github/workflows/apply-review-link-policy.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add policy/generic.md github-review-policy.md skill/references/generic.md .github/workflows/apply-review-link-policy.yml
          git commit -m "Require links to submitted reviews"
          git push origin HEAD:agent/link-submitted-review
